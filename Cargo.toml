[package]
name = "eodms-data-downloader"
version = "1.0.5"
edition = "2021"

[features]
gui = ["egui","eframe"]

[dependencies]
clap = "4"
dirs = "6.0"
eframe = { version = "0.35", optional = true }
egui = { version = "0.35", optional = true }
env-var = "1"
log = { version = "0.4" }
log4rs = "1.4"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rust-ini = "0.21"
simple-error = "0.3"
url = "2"

[[bin]]
name = "gui"
required-features = ["egui", "eframe"]

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
